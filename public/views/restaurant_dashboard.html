<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>JellyFood - Pasta Paradise</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="/public/styles/restaurant_dashboard.css" rel="stylesheet"/>
</head>
<body>
    <div class="main-wrapper">
        <!-- TopNavBar -->
        <header>
            <div class="header-left">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
                        </svg>
                    </div>
                    <h2 class="logo-text">JellyFood</h2>
                </div>
                <a href="/" class="nav-link">Restauracje</a>
            </div>
            <div class="header-right">
                <button class="cart-button" id="cartButton" onclick="window.location.href='/public/views/bin.html'">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
                <div id="authButtons">
                    <a class="login-link" href="/login">Zaloguj się</a>
                    <button class="register-btn" onclick="window.location.href='/register'">Zarejestruj się</button>
                </div>
                <div id="userProfile" style="display: none;" class="user-profile">
                    <button class="user-menu-btn" onclick="toggleUserMenu()">
                        <span class="material-symbols-outlined">account_circle</span>
                        <span id="userName"></span>
                        <span class="material-symbols-outlined">expand_more</span>
                    </button>
                    <div id="userDropdown" class="user-dropdown" style="display: none;">
                        <a href="/profile" class="user-menu-item">Mój profil</a>
                        <a href="/orders" class="user-menu-item">Moje zamówienia</a>
                        <a href="/favorites" class="user-menu-item">Ulubione</a>
                        <hr class="user-menu-divider"/>
                        <button onclick="logout()" class="user-menu-item logout-btn">Wyloguj się</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="content-max-width">
                <!-- Left Column: Restaurant Details & Menu -->
                <div class="menu-column">
                    <!-- Restaurant Header Banner -->
                    <div class="restaurant-banner">
                        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUY-8uTxHfx_7I-Wv4BDy7wiu0BwnRvv7Ov7g2G3gv7evoEYO1O5CMtUvWvG6jmOS4NNzwQgX-ZdtLWOaxWlMbH29w7d1p_HaLu4-va_Cn8Y2MKqftmTe0NZlaWNAN1ySyv8WfpQ2EhN3bObb50iftHHCekjXTohNkEjCz-9PfxhxKCE5XFLrA9j5Lo_pjBzmad_A8CyAh8IrF-FB8K9bfdyN2fouNeFene6N4pwzP0ttvh8J4RR8jxXDaOa4duwfrjsYPeFfi-p4" alt="Pasta Paradise Banner"/>
                        <div class="banner-overlay"></div>
                        <div class="banner-content">
                            <div class="restaurant-logo">
                                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2fjAeGQt7DONYEa_Z21x0J43KOkcZ_BvyZXae0geXOmt_UVRvoOpdGPFx9vUJ8DgbUeu_TzuhH5bHxXM7VeA_dcBK2mQySsVzTurKVvlVbvdPbRUIA-Rk_xYJ1d5qqAPASfKiyhcR5YJ3j1OXnjY54pKHCWAfDi9zAJFNaCfLox-zLWLwwPQ1rVy1bHUCuvC699aOA_ByFg_wpNwgi8gFTs2S_VSflae-W_fVgg6zL5aIhPVRROVfDxkBJCtkKiFavLA8PPwi_3M" alt="Pasta Paradise Logo"/>
                            </div>
                            <h1 class="restaurant-title">Pasta Paradise</h1>
                        </div>
                    </div>

                    <!-- Restaurant Info Card -->
                    <div class="restaurant-info" id="restaurantInfo">
                        <p class="restaurant-description">Ładowanie...</p>
                        <div class="restaurant-badges" id="restaurantBadges">
                        </div>
                    </div>

                    <!-- Menu Sections -->
                    <div class="menu-sections" id="menuSections">
                        <!-- Menu będzie ładowane dynamicznie -->
                    </div>
                </div>

                <!-- Usunieto panel zamowienia -->
            </div>
        </main>
    </div>

<script src="/public/script/restaurant_dashboard.js"></script>
</body>
</html>
