<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JellyFood - Zamów jedzenie z dostawą</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/public/styles/main_page.css" rel="stylesheet"/>
</head>
<body>
<div class="main-wrapper">
<div class="content-wrapper">
<div class="max-width-wrapper">
<div class="inner-container">
<!-- Top Navigation Bar -->
<header>
<div class="header-left">
<div class="logo-section">
<div class="logo-icon">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
</svg>
</div>
<h2 class="logo-text">JellyFood</h2>
</div>
<div class="location-input">
<span class="material-symbols-outlined">location_on</span>
<select id="citySelect" class="city-select" onchange="filterByCity()">
<option value="">Wszystkie miasta</option>
<option value="Warszawa" selected>Warszawa</option>
<option value="Kraków">Kraków</option>
<option value="Rzeszów">Rzeszów</option>
<option value="Lublin">Lublin</option>
<option value="Wrocław">Wrocław</option>
<option value="Szczecin">Szczecin</option>
<option value="Poznań">Poznań</option>
<option value="Gdańsk">Gdańsk</option>
<option value="Tomaszów Lubelski">Tomaszów Lubelski</option>
</select>
</div>
</div>
<div class="header-right">
<button class="cart-button" id="cartButton" onclick="window.location.href='/public/views/bin.html'">
  <span class="material-symbols-outlined">shopping_cart</span>
  <span class="cart-badge" id="cartBadge">0</span>
</button>
<div id="authButtons">
  <a class="login-link" href="/login">Zaloguj się</a>
  <button class="register-btn" onclick="window.location.href='/register'">Zarejestruj się</button>
</div>
<div id="userProfile" style="display: none;" class="user-profile">
  <button class="user-menu-btn" onclick="toggleUserMenu()">
    <span class="material-symbols-outlined">account_circle</span>
    <span id="userName"></span>
    <span class="material-symbols-outlined">expand_more</span>
  </button>
  <div id="userDropdown" class="user-dropdown" style="display: none;">
    <a href="/profile" class="user-menu-item">Mój profil</a>
    <a href="/orders" class="user-menu-item">Moje zamówienia</a>
    <hr class="user-menu-divider"/>
    <button onclick="logout()" class="user-menu-item logout-btn">Wyloguj się</button>
  </div>
</div>
</div>
</header>

<main>
<!-- Page Heading -->
<div class="page-heading">
<div class="heading-left">
<p class="heading-title">Twoje ulubione jedzenie, dostarczone błyskawicznie.</p>
<p class="heading-subtitle">Znajdź najlepsze restauracje w swojej okolicy.</p>
</div>
</div>

<!-- Search and Filter Bar -->
<div class="search-section">
<div class="search-wrapper">
<label class="search-input-container">
<div class="search-input-box">
<div class="search-icon">
<span class="material-symbols-outlined">search</span>
</div>
<input class="search-input" placeholder="Szukaj restauracji lub dania..." value="" id="searchInput" onkeyup="searchRestaurants()"/>
</div>
</label>
</div>
</div>

<!-- Kitchen Types Section -->
<div class="kitchen-types-section">
<h3 class="section-title">Rodzaje kuchni</h3>
<div class="kitchen-types-grid" id="kitchenTypesGrid">
<!-- Rodzaje kuchni będą ładowane dynamicznie -->
</div>
</div>

<!-- Restaurants -->
<div class="restaurants-section">
<div class="restaurants-grid" id="restaurantsGrid">
<!-- Restauracje będą ładowane dynamicznie JavaScript'em -->
</div>
</div>
</main>
</div>
</div>
</div>
</div>

<script src="/public/script/auth-guard.js"></script>
<script>
    // Sprawdź czy użytkownik nie jest adminem lub pracownikiem restauracji
    // Admin i pracownicy restauracji są automatycznie redirectowani
    fetch('/auth/check').then(r => r.json()).then(data => {
        if (data.success && data.user) {
            if (data.user.role_id === 1) {
                window.location.href = '/admin';
            } else if (data.user.role_id === 3) {
                window.location.href = '/public/views/restaurant-orders-dashboard.html';
            }
        }
    }).catch(err => console.error('Błąd sprawdzenia roli:', err));
</script>
<script src="/public/script/main_page.js"></script>
