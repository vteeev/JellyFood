<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JellyFood - Twój Koszyk</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/public/styles/bin.css" rel="stylesheet"/>
</head>
<body>
<div class="cart-container">
<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo-section">
      <div class="logo-icon">
        <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
        </svg>
      </div>
      <h2 class="logo-text">JellyFood</h2>
    </div>
    <a href="/" class="nav-link">Restauracje</a>
  </div>
  <div class="header-right">
    <button class="cart-button" id="cartButton" onclick="window.location.href='/public/views/bin.html'">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
    <div id="authButtons">
      <a class="login-link" href="/login">Zaloguj się</a>
      <button class="register-btn" onclick="window.location.href='/register'">Zarejestruj się</button>
    </div>
    <div id="userProfile" style="display: none;" class="user-profile">
      <button class="user-menu-btn" onclick="toggleUserMenu()">
        <span class="material-symbols-outlined">account_circle</span>
        <span id="userName"></span>
        <span class="material-symbols-outlined">expand_more</span>
      </button>
      <div id="userDropdown" class="user-dropdown" style="display: none;">
        <a href="/profile" class="user-menu-item">Mój profil</a>
        <a href="/orders" class="user-menu-item">Moje zamówienia</a>
        <a href="/favorites" class="user-menu-item">Ulubione</a>
        <hr class="user-menu-divider"/>
        <button onclick="logout()" class="user-menu-item logout-btn">Wyloguj się</button>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main>
  <div class="container">
    <!-- Page Heading -->
    <div class="page-heading">
      <div class="heading-left">
        <h1 class="page-title">Twój Koszyk</h1>
        <p class="page-subtitle">Sprawdź swoje zamówienie i przejdź do płatności.</p>
      </div>
      <button class="continue-shopping-btn" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
        <span>Kontynuuj zakupy</span>
      </button>
    </div>

    <div class="cart-grid">
      <!-- Items List -->
      <div class="items-list" id="cartItemsList">
        <!-- Będzie ładowane dynamicznie -->
      </div>

      <!-- Order Summary -->
      <aside>
        <div class="summary-card">
          <h2 class="summary-title">Podsumowanie</h2>
          <div class="summary-items">
            <div class="summary-row">
              <span>Produkty</span>
              <span id="subtotalAmount">0.00 zł</span>
            </div>
            <div class="summary-row">
              <span>Dostawa</span>
              <span>9.99 zł</span>
            </div>
          </div>
          <div class="summary-row total">
            <span>Do zapłaty</span>
            <span class="amount" id="totalAmount">9.99 zł</span>
          </div>

          <div class="promo-section">
            <label class="promo-label" for="promo-code">Kod rabatowy</label>
            <div class="promo-wrapper">
              <input class="promo-input" id="promo-code" placeholder="Wpisz kod" type="text"/>
              <button class="promo-btn">Użyj</button>
            </div>
          </div>

          <button class="checkout-btn" id="checkoutBtn">Przejdź do zamówienia</button>
        </div>
      </aside>
    </div>
  </div>
</main>
</div>

<script src="/public/script/auth-guard.js"></script>
<script>
    // Sprawdź czy użytkownik nie jest adminem lub pracownikiem restauracji
    fetch('/auth/check').then(r => r.json()).then(data => {
        if (data.success && data.user) {
            if (data.user.role_id === 1) {
                window.location.href = '/admin';
            } else if (data.user.role_id === 3) {
                window.location.href = '/public/views/restaurant-orders-dashboard.html';
            }
        }
    }).catch(err => console.error('Błąd sprawdzenia roli:', err));
</script>
<script src="/public/script/bin.js"></script>
</body>
</html>
