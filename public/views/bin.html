<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JellyFood - Twój Koszyk</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/public/styles/bin.css" rel="stylesheet"/>
</head>
<body>
<div class="cart-container">
<!-- Header -->
<header>
  <div class="header-wrapper">
    <div class="header-left">
      <div class="logo-icon">
        <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
        </svg>
      </div>
      <h2 class="logo-text">JellyFood</h2>
    </div>
    <nav>
      <a href="/">Restauracje</a>
    </nav>
    <div class="header-right">
      <button class="header-icon-btn">
        <span class="material-symbols-outlined">shopping_bag</span>
      </button>
      <div class="user-avatar" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAPwhhKFRCVuX9NxyuHXaVANffy407PBpBXmMtvmLam8pqiDDHwNKOl9TIjkPdbs9bk2OhL4jiaAU9tgiXUfnEVAkco7rLO9WBi9Gd32UZH_6sNrzb-Y8c-aIeuxFsvuZhphH6CyYCCcv1DbWHDUeuFqdY6ZxgkeONVYsgWk0nn-dPRxpbaV0XUsWA8EBuX69mD-5z1M01hz5jy0tiElZgzcLyX5yxPQw_aItOirV9Nlj05ypYIG8Fc6FLcRCrC5Wq7N62YXBT7PIk');"></div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main>
  <div class="container">
    <!-- Page Heading -->
    <div class="page-heading">
      <div class="heading-left">
        <h1 class="page-title">Twój Koszyk</h1>
        <p class="page-subtitle">Sprawdź swoje zamówienie i przejdź do płatności.</p>
      </div>
      <button class="continue-shopping-btn" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
        <span>Kontynuuj zakupy</span>
      </button>
    </div>

    <div class="cart-grid">
      <!-- Items List -->
      <div class="items-list" id="cartItemsList">
        <!-- Będzie ładowane dynamicznie -->
      </div>

      <!-- Order Summary -->
      <aside>
        <div class="summary-card">
          <h2 class="summary-title">Podsumowanie</h2>
          <div class="summary-items">
            <div class="summary-row">
              <span>Produkty</span>
              <span id="subtotalAmount">0.00 zł</span>
            </div>
            <div class="summary-row">
              <span>Dostawa</span>
              <span>9.99 zł</span>
            </div>
          </div>
          <div class="summary-row total">
            <span>Do zapłaty</span>
            <span class="amount" id="totalAmount">9.99 zł</span>
          </div>

          <div class="promo-section">
            <label class="promo-label" for="promo-code">Kod rabatowy</label>
            <div class="promo-wrapper">
              <input class="promo-input" id="promo-code" placeholder="Wpisz kod" type="text"/>
              <button class="promo-btn">Użyj</button>
            </div>
          </div>

          <button class="checkout-btn" id="checkoutBtn">Przejdź do zamówienia</button>
        </div>
      </aside>
    </div>
  </div>
</main>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('jellyFoodCart')) || [];

document.addEventListener('DOMContentLoaded', () => {
    renderCart();
});

function renderCart() {
    const cartContainer = document.getElementById('cartItemsList');
    
    if (cart.length === 0) {
        cartContainer.innerHTML = `
            <div style="text-align: center; padding: 3rem;">
                <span class="material-symbols-outlined" style="font-size: 4rem; color: var(--gray-400);">shopping_cart</span>
                <p style="font-size: 1.25rem; margin-top: 1rem; color: var(--gray-500);">Twój koszyk jest pusty</p>
                <button onclick="window.history.back()" style="margin-top: 1.5rem; padding: 0.75rem 1.5rem; background-color: var(--primary); border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">Wróć do zakupów</button>
            </div>
        `;
        updateSummary();
        return;
    }
    
    cartContainer.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <div class="item-info">
            <div class="item-image" style="background-image: url('${item.image}');"></div>
            <div class="item-details">
              <p class="item-name">${item.name}</p>
              <p class="item-price">${item.price.toFixed(2)} zł</p>
            </div>
          </div>
          <div class="item-controls">
            <div class="quantity-control">
              <button class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
              <span class="qty-display">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
            </div>
            <p class="item-total">${(item.price * item.quantity).toFixed(2)} zł</p>
            <button class="remove-btn" onclick="removeItem(${index})" title="Usuń">
                <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>
    `).join('');
    
    updateSummary();
}

function updateQuantity(index, delta) {
    cart[index].quantity = Math.max(1, cart[index].quantity + delta);
    localStorage.setItem('jellyFoodCart', JSON.stringify(cart));
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('jellyFoodCart', JSON.stringify(cart));
    renderCart();
}

function updateSummary() {
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const delivery = cart.length > 0 ? 9.99 : 0;
    const total = subtotal + delivery;
    
    document.getElementById('subtotalAmount').textContent = `${subtotal.toFixed(2)} zł`;
    document.getElementById('totalAmount').textContent = `${total.toFixed(2)} zł`;
}

document.getElementById('checkoutBtn').addEventListener('click', () => {
    if (cart.length === 0) {
        alert('Twój koszyk jest pusty!');
        return;
    }
    
    // Przekierowanie do complete_order.html
    window.location.href = '/public/views/complete_order.html';
});
</script>
</body>
</html>
