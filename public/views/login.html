<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JellyFood - Zaloguj się</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/public/styles/login.css" rel="stylesheet"/>
</head>
<body class="font-display">
<div class="container">
  <div class="layout-wrapper">
    <div class="layout-content">
      <!-- Left Image Section -->
      <div class="image-section">
        <div class="image-section-bg" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCmtYf4LnFugYlT9QTMEMiNyPCZYu4nbRVz-VF4xSjGeg30lDcch1Fq_RqPl8Yg0Clm8hKuiNpXSfisV2qh6cP7bTEC3821KJv0CWujkevtZFPYhgf56HsUnbbCFVSQzh11a_-ichZQPp5OnNr28r81w0l1bQlveYjvjrCzrlkP_pFt3mn2X-fTjsPYShQUqfr1XO_e5UwN7qx-whcJolXkqdEgLVePIXlyxVI-w416LLAfBsjneqoDns3HwCrFXhGVs8c7TVFj36o");'></div>
      </div>

      <!-- Right Form Section -->
      <div class="form-section">
        <div class="logo">
          <h1 class="logo-text">JellyFood</h1>
        </div>

        <div class="form-header">
          <p class="form-title">Witaj ponownie!</p>
          <p class="form-subtitle">Zaloguj się, by zamówić</p>
        </div>

        <div class="form-container">
          <div id="errorMessage" class="error-message" style="display: none;"></div>

          <form id="loginForm" class="form-fields">
            <div class="form-field-group">
              <label class="form-label">E-mail</label>
              <input class="form-input" placeholder="wpisz swój e-mail" type="email" name="email" required/>
            </div>

            <div class="form-field-group">
              <label class="form-label">Hasło</label>
              <div class="password-wrapper">
                <input class="form-input password-input" placeholder="wpisz swoje hasło" type="password" name="password" id="password-input" required/>
                <button class="password-toggle" type="button" onclick="togglePassword(event)">
                  <span class="material-symbols-outlined" id="password-icon">visibility</span>
                </button>
              </div>
            </div>

            <a class="forgot-password" href="#">Zapomniałem hasła</a>

            <button class="btn-primary" type="submit" id="submitBtn">Zaloguj się</button>
          </form>
        </div>

        <div class="form-footer">
          <p class="form-footer-text">
            Nie masz jeszcze konta? <a class="form-footer-link" href="/register">Zarejestruj się</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function togglePassword(event) {
  event.preventDefault();
  const input = document.getElementById('password-input');
  const icon = document.getElementById('password-icon');
  
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const form = e.target;
  const submitBtn = document.getElementById('submitBtn');
  const errorDiv = document.getElementById('errorMessage');
  
  const email = form.email.value;
  const password = form.password.value;
  
  // Walidacja
  if (!email || !password) {
    errorDiv.textContent = 'Email i hasło są wymagane!';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Wyłączenie przycisku
  submitBtn.disabled = true;
  submitBtn.textContent = 'Logowanie...';
  errorDiv.style.display = 'none';
  
  try {
    const response = await fetch('/auth/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams({ email, password }),
    });
    
    const data = await response.json();
    
    if (data.success) {
      // Redirect do strony głównej
      alert('Logowanie pomyślne!');
      window.location.href = '/';
    } else {
      errorDiv.textContent = data.message || 'Błąd podczas logowania!';
      errorDiv.style.display = 'block';
    }
  } catch (error) {
    errorDiv.textContent = 'Błąd sieci: ' + error.message;
    errorDiv.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Zaloguj się';
  }
});
</script>
</body></html>
