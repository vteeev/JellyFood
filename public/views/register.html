<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JellyFood - Zarejestruj się</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="/public/styles/register.css" rel="stylesheet"/>
</head>
<body>
<div class="registration-container">
  <header class="registration-header">
    <a class="header-logo" href="#">
      <svg class="logo-icon" fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
      </svg>
      <h2 class="logo-text">JellyFood</h2>
    </a>
    <a class="header-login-btn" href="/login">Log In</a>
  </header>

  <main class="registration-main">
    <div class="registration-card">
      <div class="registration-card-header">
        <p class="registration-title">Stwórz nowe konto</p>
      </div>

      <form class="registration-form" id="registerForm">
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="form-fields-group">
          <div class="form-field">
            <label>Imię i nazwisko</label>
            <input autocomplete="name" placeholder="Wpisz swoje imię i nazwisko" type="text" name="full_name" required/>
          </div>

          <div class="form-field">
            <label>Adres e-mail</label>
            <input autocomplete="email" placeholder="Wpisz swój adres e-mail" type="email" name="email" required/>
          </div>

          <div class="form-field">
            <label>Numer telefonu (opcjonalnie)</label>
            <input autocomplete="tel" placeholder="Wpisz swój numer telefonu" type="tel" name="phone"/>
          </div>

          <div class="form-field">
            <label>Hasło</label>
            <div class="password-input-wrapper">
              <input autocomplete="new-password" placeholder="Wpisz swoje hasło (min. 8 znaków)" type="password" class="password-input" name="password" id="password-1" required/>
              <button class="password-toggle-btn" type="button" onclick="togglePassword(event, 'password-1')">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>

          <div class="form-field">
            <label>Powtórz hasło</label>
            <div class="password-input-wrapper">
              <input autocomplete="new-password" placeholder="Powtórz swoje hasło" type="password" class="password-input" name="password_confirm" id="password-2" required/>
              <button class="password-toggle-btn" type="button" onclick="togglePassword(event, 'password-2')">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
        </div>

        <div class="form-section-title">
          <h3>Adres dostawy</h3>
        </div>

        <div class="form-fields-group">
          <div class="form-field">
            <label>Ulica i numer budynku</label>
            <input autocomplete="street-address" placeholder="np. Krakowska 12" type="text" name="street" required/>
          </div>

          <div class="form-field">
            <label>Numer mieszkania (opcjonalnie)</label>
            <input placeholder="np. 3" type="text" name="apartment_number"/>
          </div>

          <div class="form-field">
            <label>Miasto</label>
            <input autocomplete="address-level2" placeholder="np. Kraków" type="text" name="city" required/>
          </div>

          <div class="form-field">
            <label>Kod pocztowy</label>
            <input autocomplete="postal-code" placeholder="np. 31-062" type="text" name="postal_code" required/>
          </div>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="terms" name="terms" required/>
          <div class="checkbox-label-text">
            <label for="terms">
              Akceptuję <a href="#">Regulamin</a> oraz <a href="#">Politykę Prywatności</a>.
            </label>
          </div>
        </div>

        <button class="submit-btn" type="submit" id="submitBtn">Zarejestruj się</button>
      </form>

      <div class="registration-footer">
        <p>Masz już konto? <a href="/login">Zaloguj się</a></p>
      </div>
    </div>
  </main>
</div>
<script>
function togglePassword(event, id) {
  event.preventDefault();
  const input = document.getElementById(id);
  const btn = event.target.closest('.password-toggle-btn');
  const icon = btn.querySelector('.material-symbols-outlined');
  
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const form = e.target;
  const submitBtn = document.getElementById('submitBtn');
  const errorDiv = document.getElementById('errorMessage');
  
  // Zbiór danych
  const formData = {
    full_name: form.full_name.value,
    email: form.email.value,
    phone: form.phone.value || null,
    password: form.password.value,
    password_confirm: form.password_confirm.value,
    street: form.street.value,
    apartment_number: form.apartment_number.value || null,
    city: form.city.value,
    postal_code: form.postal_code.value,
    country: 'Polska'
  };
  
  // Walidacja hasła
  if (formData.password !== formData.password_confirm) {
    errorDiv.textContent = 'Hasła się nie zgadzają!';
    errorDiv.style.display = 'block';
    return;
  }
  
  if (formData.password.length < 8) {
    errorDiv.textContent = 'Hasło musi mieć co najmniej 8 znaków!';
    errorDiv.style.display = 'block';
    return;
  }
  
  if (!form.terms.checked) {
    errorDiv.textContent = 'Musisz zaakceptować regulamin i politykę prywatności!';
    errorDiv.style.display = 'block';
    return;
  }
  
  // Wyłączenie przycisku
  submitBtn.disabled = true;
  submitBtn.textContent = 'Rejestrowanie...';
  errorDiv.style.display = 'none';
  
  try {
    const response = await fetch('/auth/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams(formData),
    });
    
    const data = await response.json();
    
    if (data.success) {
      // Redirect do logowania
      alert('Rejestracja pomyślna! Zaloguj się teraz.');
      window.location.href = '/login';
    } else {
      errorDiv.textContent = data.message || 'Błąd podczas rejestracji!';
      errorDiv.style.display = 'block';
    }
  } catch (error) {
    errorDiv.textContent = 'Błąd sieci: ' + error.message;
    errorDiv.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Zarejestruj się';
  }
});
</script>
</body>
</html>
